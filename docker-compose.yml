services:
  churn-analyzer:
    build:
      context: .
      dockerfile: Dockerfile
    image: aeza-churn-risk-analyzer:latest
    container_name: aeza_churn_analyzer
    restart: unless-stopped
    ports:
      - "80:8000"
      - "8000:8000"
    environment:
      - DATA_DIR=/app/data
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=aeza2026
      - SECRET_KEY=aeza-hackathon-rnd-super-secret-key-2026
      - OIDC_ENABLED=true
    volumes:
      - ./data:/app/data
      - ./app:/app/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/metrics"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
